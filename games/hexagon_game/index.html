<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div id="welcome-screen">
        <h1>Welcome to Hexagon Game</h1>
        <div id="game-instructions">Game instructions appear here...</div>
        <button id="player-vs-bot">Play vs Bot</button>
        <button id="player-vs-player">Play vs Player</button>
        <div id="player-names" style="display:none;">
            <input type="text" id="player1-name" placeholder="Player 1 Name">
            <input type="text" id="player2-name" placeholder="Player 2 Name">
        </div>
        <div>
            <label><input type="radio" name="level" value="easy"> Easy</label>
            <label><input type="radio" name="level" value="medium"> Medium</label>
            <label><input type="radio" name="level" value="hard"> Hard</label>
        </div>
        <button id="start-game" disabled>Play Game</button>
    </div>
    
    <div id="game-board" style="display:none;">
        <h2>Game Board</h2>
        <div id="hex-board" class="board"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
